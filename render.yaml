services:
  - type: web
    name: AutoAgentHire
    env: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: "bash ./build.sh"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "false"
      - key: API_RELOAD
        value: "false"
      - key: CORS_ORIGINS
        value: "https://auto-agent-hire.vercel.app,http://localhost:5173"
      - key: DISABLE_LOCAL_VECTOR_STORE
        value: "true"
      - key: SKIP_PLAYWRIGHT_INSTALL
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      # Optional secrets to set in Render Dashboard Environment tab:
      # - key: MONGODB_URI (e.g. mongodb+srv://hyraiauto_db_user:...@cluster0.amc4psk.mongodb.net/autoagenthire?retryWrites=true&w=majority)
      # - key: MONGODB_DB_NAME (autoagenthire)
      # - key: GEMINI_API_KEY
      # - key: GROQ_API_KEY
      # - key: GITHUB_API_KEY
    autoDeploy: true
