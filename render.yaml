services:
  - type: web
    name: AutoAgentHire
    env: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: "bash ./build.sh"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "false"
      - key: API_RELOAD
        value: "false"
      - key: CORS_ORIGINS
        value: "https://auto-agent-hire.vercel.app,http://localhost:5173"
      - key: DISABLE_LOCAL_VECTOR_STORE
        value: "true"
      - key: SKIP_PLAYWRIGHT_INSTALL
        value: "1"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: ALLOW_OTP_PREVIEW
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      # Optional secrets to set in Render Dashboard Environment tab:
      # - key: RESEND_API_KEY (Recommended: https://resend.com - works over port 443 on Render free tier)
      # - key: BREVO_API_KEY (Free: https://brevo.com - 300 free emails/day over port 443)
      # - key: SENDGRID_API_KEY
      # - key: SMTP_USER (e.g. hyrai.auto@gmail.com)
      # - key: SMTP_PASSWORD (Google App Password)
      # - key: MONGODB_URI (e.g. mongodb+srv://...)
      # - key: MONGODB_DB_NAME (autoagenthire)
      # - key: GEMINI_API_KEY
      # - key: GROQ_API_KEY
      # - key: GITHUB_API_KEY
    autoDeploy: true
